services:
  - type: web
    name: shrsh-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_NAME
        value: portfolio
      - key: MONGO_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
